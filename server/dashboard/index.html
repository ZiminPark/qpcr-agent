<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>가상 실험실 — 대시보드</title>
<style>
  :root { --line:#ccc; --dim:#777; --ok:#2a7; --busy:#d80; --bad:#d33; --fill:#48c; }
  * { box-sizing: border-box; }
  body { font-family: -apple-system, "Apple SD Gothic Neo", sans-serif; margin: 0; background:#f5f5f2; color:#222; }
  .wrap { max-width: 860px; margin: 0 auto; padding: 12px; }
  header { display:flex; align-items:center; height:48px; margin-bottom:14px; gap:10px; }
  header .left { display:flex; align-items:center; gap:10px; }
  header h1 { font-size: 22px; margin: 0; }
  /* batch 세그먼트 토글 (결정 28) — 전환은 파괴가 아니라 이동이므로 chip+버튼 대신 하나의 토글로 */
  header .batch-toggle { display:flex; background:#f0f0ec; border-radius:9px; padding:2px; gap:2px; }
  header .batch-seg { font-size:12px; font-weight:500; padding:3px 10px; border-radius:7px; border:none; background:transparent; color:var(--dim); cursor:pointer; }
  header .batch-seg:hover { color:#222; }
  header .batch-seg.active { background:#fff; color:#222; font-weight:600; box-shadow:0 1px 2px rgba(0,0,0,.1); }
  header .spacer { flex:1; }
  header .right { display:flex; align-items:center; gap:8px; }
  header .conn { font-size: 12px; color: var(--dim); }
  header .conn.off { color: var(--bad); font-weight: 700; }
  header .admin-btn { font-size:13px; padding:6px 12px; border-radius:6px; border:1px solid #e6e6e2; background:transparent; color:var(--dim); cursor:pointer; }
  header .admin-btn:hover { background:#eee; color:#222; border-color:var(--line); }
  header .divider { width:1px; height:20px; background:var(--line); }
  header .icon-btn { font-size: 16px; padding: 6px 10px; border-radius: 6px; border: 1px solid transparent; background: transparent; line-height: 1; color: var(--dim); cursor:pointer; }
  header .icon-btn:hover { background: #eee; }

  /* 우측 슬라이드오버 패널 공통 틀 (프롬프트 모음 결정 26 / 실험 노트 결정 29) — 뒤 대시보드를 가리지 않음 */
  .prompts, .labnote {
    position: fixed; top: 0; right: 0; bottom: 0; width: 400px; max-width: 92vw;
    background: #fff; border-left: 1px solid var(--line); box-shadow: -6px 0 18px rgba(0,0,0,.12);
    padding: 14px 14px 20px; overflow-y: auto; z-index: 50;
    transform: translateX(100%); transition: transform .18s ease-out;
  }
  .prompts.open, .labnote.open { transform: translateX(0); }
  .sidebar-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; }
  .prompts h2, .labnote h2 { font-size:16px; margin:0; }
  .sidebar-close { font-size:16px; line-height:1; padding:4px 9px; border-radius:6px; border:1px solid var(--line); background:#fff; cursor:pointer; color:var(--dim); }
  .sidebar-close:hover { background:#eee; }
  .prompts-stage { margin-bottom:14px; }
  .prompts-stage:last-child { margin-bottom:0; }
  .prompts-stage-name { font-size:14px; font-weight:700; color:var(--dim); margin-bottom:6px; text-transform:none; }
  .prompt-item { border:1px solid #eee; border-radius:6px; padding:8px 10px; margin-bottom:6px; }
  .prompt-item:last-child { margin-bottom:0; }
  .prompt-head { display:flex; justify-content:space-between; align-items:baseline; gap:10px; }
  .prompt-name { font-size:14px; font-weight:600; }
  .prompt-desc { font-size:13px; color:var(--dim); margin-top:2px; }
  .prompt-body { font-family:ui-monospace,monospace; font-size:13px; white-space:pre-wrap; background:#f7f7f5; border-radius:4px; padding:8px 10px; margin-top:6px; line-height:1.5; }
  .prompt-copy { font-size:12px; padding:4px 10px; border-radius:6px; border:1px solid var(--line); background:#fff; cursor:pointer; white-space:nowrap; }
  .prompt-copy:hover { background:#eee; }
  .prompt-copy.copied { color:var(--ok); border-color:var(--ok); }
  .prompts-empty { color:var(--dim); font-size:14px; }

  /* 실험 노트 패널 (결정 29) — 서버 GET /labnote(마크다운)를 초소형 변환으로 렌더 */
  .labnote-body { font-size:14px; line-height:1.6; color:#333; }
  .labnote-body .md-h1 { font-size:16px; font-weight:700; margin:14px 0 6px; }
  .labnote-body .md-h1:first-child { margin-top:0; }
  .labnote-body .md-h2 { font-size:13px; font-weight:700; color:var(--dim); margin:12px 0 4px; }
  .labnote-body p { margin:0 0 8px; }
  .labnote-body ul { margin:0 0 8px; padding-left:18px; }
  .labnote-body li { margin-bottom:3px; }
  .labnote-body strong { font-weight:700; }
  .labnote-empty { color:var(--dim); font-size:14px; }

  .devices { display:flex; flex-wrap:wrap; gap:10px; margin-bottom:10px; align-items:stretch; }
  .dev { flex:1; min-width:160px; background:#fff; border:1px solid var(--line); border-radius:6px; padding:10px 12px; }
  .dev .dev-head { display:flex; align-items:center; gap:8px; min-height:32px; }
  .dev .device-icon {
    flex:0 0 32px; width:32px; height:32px; padding:5px; border-radius:9px;
    color:#4d6478; background:#f1f5f7;
  }
  .dev .device-icon svg { display:block; width:100%; height:100%; }
  .dev .name { font-size: 15px; font-weight: 600; }
  .dev .role-chip { display:inline-block; font-size:11px; font-weight:500; color:var(--dim); background:#f0f0ec; border-radius:9px; padding:1px 7px; margin-left:6px; vertical-align:1px; }
  .dev .badge { display:inline-block; font-size:14px; font-weight:700; padding:1px 8px; border-radius:10px; margin-top:6px; color:#fff; }
  .badge.idle { background:#999; } .badge.busy { background:var(--busy); } .badge.reserved { background:var(--fill); }
  .badge.active { background:var(--busy); }
  .dev.active { border-color:var(--busy); background:#fffaf2; }
  .dev .sub { font-size: 13px; color: var(--dim); margin-top:6px; }
  .devices-arrow { flex: 0 0 auto; align-self:center; color:var(--dim); font-size:14px; }

  .main { background:#fff; border:1px solid var(--line); border-radius:6px; padding:12px; margin-bottom:10px; }
  .main-title { font-size:20px; margin:28px 0 8px; }
  .main-sub { display:flex; justify-content:space-between; align-items:baseline; font-size:13px; color:var(--dim); margin-bottom:8px; gap: 10px; }
  .main-sub .anomaly-hint { color: var(--bad); font-weight: 700; }
  #curveWrap { height: 280px; }
  #curveWrap canvas { width:100% !important; height:100% !important; }
  #curveEmpty { color: var(--dim); font-size: 14px; padding: 40px 0; text-align: center; }
  /* 런 진행 바 (결정 30 시각화 ③) */
  .curve-progress-row { display:flex; align-items:center; gap:10px; margin-top:10px; font-size:13px; color:var(--dim); }
  .curve-progress-track { flex:1; height:6px; background:#eee; border-radius:3px; overflow:hidden; }
  .curve-progress-fill { height:100%; width:0%; background:var(--fill); border-radius:3px; transition:width .3s linear; }
  .curve-progress-text { white-space:nowrap; }

  /* 플레이트 그리드 */
  table.plate { border-collapse:collapse; margin:0 auto; }
  table.plate td, table.plate th { border:1px solid #ddd; width:32px; height:26px; text-align:center; font-size:11px; color:var(--dim); }
  td.filled { background:#cfe0f5; } td.done { background:#cfeadd; } td.bad { background:#f5c9c9; font-weight:700; color:#900; }
  .legend { font-size:12px; color:var(--dim); text-align:center; margin-top:6px; }
  .sw { display:inline-block; width:11px; height:11px; border:1px solid #ccc; vertical-align:-1px; }

  /* 결과표 */
  table.results { border-collapse:collapse; width:100%; font-size:14px; }
  table.results th, table.results td { border:1px solid #eee; padding:6px 8px; text-align:center; }
  table.results th { color:var(--dim); font-weight:600; font-size:12px; }
  table.results td.rep { width:70px; }
  table.results td.ok { background:#eaf7f0; color:var(--ok); }
  table.results td.bad { background:#f5c9c9; color:#900; font-weight:700; }
  table.results td.empty { background:#f7f7f5; color:#bbb; }

  .trace { background:#fff; border:1px solid var(--line); border-radius:6px; padding:12px; }
  .trace-title { font-size:20px; margin:28px 0 8px; }
  .trace ol { list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:10px; }
  .trace li { padding:10px 12px; border:1px solid #eee; border-left-width:3px; border-radius:6px; font-size:14px; line-height:1.5; color:#555; }
  .trace .t { display:flex; justify-content:space-between; font-size:12px; font-weight:700; letter-spacing:.06em; color:var(--dim); text-transform:uppercase; margin-bottom:5px; }
  .trace .ts { font-weight:400; letter-spacing:0; font-variant-numeric:tabular-nums; }
  .trace .tool { font-family:ui-monospace,monospace; font-size:0.95em; background:#f0f0ec; padding:1px 6px; border-radius:4px; }
  .trace .device-chip { display:inline-block; font-size:11px; font-weight:500; text-transform:none; letter-spacing:0; color:var(--dim); background:#f0f0ec; border-radius:9px; padding:1px 7px; margin-left:6px; vertical-align:1px; }
  .trace .res { color:var(--dim); font-size:0.88em; }
  .trace li.call { border-left-color: var(--fill); } /* 도구 호출 = 파랑 계열 */
  .trace li.user { background:#f2f6ff; border-radius:4px; border-left-color: var(--line); } /* 사용자 프롬프트 = 회색 */
  .trace li.approval { background:#fffceb; border-radius:4px; border-left-color: var(--busy); } /* 사람 승인 = 주황 계열 */
  .trace li.rejected { background:#fff2f2; border-color:#f0c9c9; border-left-color: var(--bad); } /* 거부된 호출 = 빨강 */
  .trace li.rejected .res { color: var(--bad); font-weight: 600; }
  @keyframes traceFlash {
    from { box-shadow: inset 0 0 0 999px rgba(72,140,204,.14); }
    to   { box-shadow: inset 0 0 0 999px rgba(72,140,204,0); }
  }
  .trace li.just-in { animation: traceFlash 1s ease-out; } /* 새 카드 도착 시 은은한 배경 페이드인 */
  .trace-empty { color: var(--dim); font-size: 14px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="left">
      <h1>🧪 가상 실험실</h1>
      <div class="batch-toggle" id="batchToggle" role="group" aria-label="배치 선택">
        <button class="batch-seg" data-batch="week1">week1</button>
        <button class="batch-seg" data-batch="week2">week2</button>
      </div>
      <span class="conn" id="connLabel"></span>
    </div>
    <div class="spacer"></div>
    <div class="right">
      <button class="admin-btn" id="resetBtn" title="현재 주를 처음 상태로">리셋</button>
      <span class="divider"></span>
      <button class="icon-btn" id="labnoteBtn" aria-label="실험 노트">📓</button>
      <button class="icon-btn" id="promptsBtn" aria-label="프롬프트 모음">☰</button>
    </div>
  </header>

  <div class="prompts" id="promptsPanel">
    <div class="sidebar-head">
      <h2>프롬프트 모음</h2>
      <button class="sidebar-close" id="promptsCloseBtn" aria-label="닫기">×</button>
    </div>
    <div id="promptsBody"></div>
  </div>

  <div class="labnote" id="labnotePanel">
    <div class="sidebar-head">
      <h2>실험 노트</h2>
      <button class="sidebar-close" id="labnoteCloseBtn" aria-label="닫기">×</button>
    </div>
    <div class="labnote-body" id="labnoteBody"></div>
  </div>

  <div class="devices" id="devices"></div>

  <!-- 결정 30: 모드 전환 폐지 — 플레이트·증폭 곡선·결과표를 각자 독립 섹션으로 병렬 표시 -->
  <h2 class="main-title">플레이트</h2>
  <div class="main">
    <div class="main-sub">
      <span id="plateDetail">—</span>
    </div>
    <table class="plate" id="plateTable"></table>
    <div class="legend">
      <span class="sw" style="background:#fff"></span> 비어있음
      <span class="sw" style="background:#cfe0f5"></span> 채워짐
      <span class="sw" style="background:#cfeadd"></span> 측정완료
      <span class="sw" style="background:#f5c9c9"></span> 이상 (Agent 판정)
      &nbsp;·&nbsp; 열 = 샘플(S01~S12), 행 A·B·C = 3반복
    </div>
  </div>

  <div id="curvesSection" style="display:none">
    <h2 class="main-title">증폭 곡선</h2>
    <div class="main">
      <div class="main-sub">
        <span id="curvesDetail">—</span>
      </div>
      <div id="curveWrap"><canvas id="curveCanvas"></canvas></div>
      <div id="curveEmpty" style="display:none">런 시작 대기 중…</div>
      <div class="curve-progress-row">
        <div class="curve-progress-track"><div class="curve-progress-fill" id="curveProgressFill"></div></div>
        <span class="curve-progress-text" id="curveProgressText">—</span>
      </div>
    </div>
  </div>

  <div id="resultsSection" style="display:none">
    <h2 class="main-title">결과표</h2>
    <div class="main">
      <div class="main-sub">
        <span id="resultsDetail">—</span>
      </div>
      <table class="results" id="resultsTable"></table>
      <div class="legend">
        <span class="sw" style="background:#eaf7f0"></span> 정상
        <span class="sw" style="background:#f5c9c9"></span> 이상 (Agent 판정)
        &nbsp;·&nbsp; 행 = 샘플(S01~S12), 열 = 3반복(A·B·C)
      </div>
    </div>
  </div>

  <h2 class="trace-title">Trace 타임라인</h2>
  <div class="trace">
    <ol id="traceList"></ol>
    <div class="trace-empty" id="traceEmpty" style="display:none">아직 기록된 이벤트가 없습니다.</div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script><script>
'use strict';

// ---- 기기 표시 이름/서브 텍스트 ----
const DEVICE_META = {
  nanodrop: {
    name: 'NanoDrop',
    icon: `<span class="device-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3s-5 6-5 10a5 5 0 0 0 10 0c0-4-5-10-5-10Z"/><path d="M10 16c.6.6 1.3.9 2 .9"/></svg></span>`,
  },
  liquid_handler: {
    name: '액체 핸들러',
    icon: `<span class="device-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3h10v4H7zM9 7v5m3-5v5m3-5v5"/><path d="M7 12h10"/><circle cx="8" cy="17" r="1.3"/><circle cx="12" cy="17" r="1.3"/><circle cx="16" cy="17" r="1.3"/><circle cx="8" cy="21" r="1.3"/><circle cx="12" cy="21" r="1.3"/><circle cx="16" cy="21" r="1.3"/></svg></span>`,
  },
  quantstudio: {
    name: 'QuantStudio',
    icon: `<span class="device-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M7 16c1.2 0 1.7-.2 2.4-2.1.7-1.8 1.2-3.4 2.2-3.4 1.1 0 1.2 2.1 2.4 2.1s1.5-3.7 3-3.7"/></svg></span>`,
  },
};
const BADGE_LABEL = { idle: '대기', busy: '작동중', reserved: '예약됨' };
// 실험 흐름 파이프라인 시각화용 역할 칩(순수 표현, 서버 무관). 매핑 없는 기기(MHS 등)는 칩·화살표 없이 나열.
const DEVICE_ROLE = { nanodrop: '① 검사', liquid_handler: '② 준비', quantstudio: '③ 측정' };

const traceSeqSeen = new Set();
let curveChart = null;
let pollTimer = null;
let lastState = null;

// ---- 기기 카드 "작동" 연출 (서버 상태는 그대로, trace 이벤트만 보고 대시보드가 잠깐 덮어씀) ----
const TOOL_ACTIVITY = {
  read_nanodrop: { device: 'nanodrop', label: '측정 중', ms: 5000 },
  run_liquid_handler: { device: 'liquid_handler', label: '작동 중', ms: 6000 },
};
const deviceActivity = { nanodrop: null, liquid_handler: null };
const deviceActivityTimers = { nanodrop: null, liquid_handler: null };

function triggerDeviceActivity(ev) {
  if (ev.type !== 'tool_call' || ev.rejected) return;
  const cfg = TOOL_ACTIVITY[ev.tool];
  if (!cfg) return;
  deviceActivity[cfg.device] = cfg.label;
  if (deviceActivityTimers[cfg.device]) clearTimeout(deviceActivityTimers[cfg.device]);
  deviceActivityTimers[cfg.device] = setTimeout(() => {
    deviceActivity[cfg.device] = null;
    deviceActivityTimers[cfg.device] = null;
    if (lastState) renderDevices(lastState);
  }, cfg.ms);
  if (lastState) renderDevices(lastState);
}

function el(id) { return document.getElementById(id); }

// ---- 기기 카드 ----
function renderDevices(state) {
  const wrap = el('devices');
  wrap.innerHTML = '';
  const keys = ['nanodrop', 'liquid_handler', 'quantstudio'];
  let prevHadRole = false;
  keys.forEach((key, i) => {
    const d = state.devices[key];
    const meta = DEVICE_META[key];
    let sub;
    if (key === 'nanodrop') {
      sub = d.last_reading_count ? `샘플 ${d.last_reading_count}개 측정됨` : '측정 기록 없음';
    } else if (key === 'liquid_handler') {
      const reagentTxt = `시약 잔량 buffer ${d.reagent_ul.toFixed(1)} µL`;
      sub = d.last_run_entries ? `작업 목록 ${d.last_run_entries}건 완료 · ${reagentTxt}` : reagentTxt;
    } else {
      sub = state.qpcr_run
        ? `qPCR 사이클 ${state.qpcr_run.cycle} / ${state.qpcr_run.total_cycles}`
        : (d.reserved ? '예약됨 · 런 대기' : '예약 안 됨');
    }
    const activity = deviceActivity[key]; // QuantStudio는 서버 상태만 따름(건드리지 않음)
    const badgeClass = activity ? 'active' : d.status;
    const badgeText = activity || (BADGE_LABEL[d.status] || d.status);
    const role = DEVICE_ROLE[key];

    if (i > 0 && role && prevHadRole) {
      const arrow = document.createElement('span');
      arrow.className = 'devices-arrow';
      arrow.textContent = '→';
      wrap.appendChild(arrow);
    }

    const card = document.createElement('div');
    card.className = 'dev' + (activity ? ' active' : '');
    card.innerHTML = `<div class="dev-head">${meta.icon}<div class="name">${meta.name}${role ? `<span class="role-chip">${role}</span>` : ''}</div></div>` +
      `<span class="badge ${badgeClass}">${badgeText}</span>` +
      `<div class="sub">${sub}</div>`;
    wrap.appendChild(card);
    prevHadRole = !!role;
  });
}

// ---- 메인 섹션 (결정 30: 모드 전환 폐지 — 플레이트는 항상, 곡선은 런 시작 후, 결과표는 런 완료 후) ----
function renderSections(state) {
  renderPlate(state);

  const run = state.qpcr_run;
  el('curvesSection').style.display = run ? 'block' : 'none';
  el('resultsSection').style.display = run && !run.running ? 'block' : 'none';
  if (run) renderCurves(state);
  if (run && !run.running) renderResults(state);
}

// ---- 플레이트 그리드 (A~H × 1~12, 실제 데이터는 A~C행만) — 항상 보이는 섹션 ----
function renderPlate(state) {
  el('plateDetail').textContent = `${state.batch} · 샘플 12 × 3반복`;
  const wells = state.plate.wells;
  let html = '<tr><th></th>';
  for (let c = 1; c <= 12; c++) html += `<th>${c}</th>`;
  html += '</tr>';
  for (const r of 'ABCDEFGH') {
    html += `<tr><th>${r}</th>`;
    for (let c = 1; c <= 12; c++) {
      const wellId = `${r}${c}`;
      const w = wells[wellId];
      let cls = '', txt = '';
      if (w) {
        if (w.display_hint) { cls = 'bad'; txt = '!'; }
        else if (w.status === 'done') cls = 'done';
        else if (w.status === 'filled') cls = 'filled';
      }
      html += `<td class="${cls}">${txt}</td>`;
    }
    html += '</tr>';
  }
  el('plateTable').innerHTML = html;
}

// ---- 결과표 (샘플별 3반복 상태) — 런 완료 후 나타나는 섹션 ----
function renderResults(state) {
  el('resultsDetail').textContent = `측정 완료 · ${state.batch}`;
  const wells = state.plate.wells;
  const bySample = {};
  for (const [wellId, w] of Object.entries(wells)) {
    (bySample[w.sample_id] = bySample[w.sample_id] || {})[w.replicate] = { ...w, well: wellId };
  }
  const sampleIds = Object.keys(bySample).sort();
  let html = '<tr><th>샘플</th><th class="rep">반복 A</th><th class="rep">반복 B</th><th class="rep">반복 C</th></tr>';
  for (const sid of sampleIds) {
    html += `<tr><th>${sid}</th>`;
    for (const rep of [1, 2, 3]) {
      const w = bySample[sid][rep];
      if (!w || w.status === 'empty') { html += '<td class="empty">—</td>'; continue; } // 플레이트에 없음(QC 탈락)
      const cqTxt = w.cq != null ? `Cq ${w.cq.toFixed(1)}` : '증폭 없음';
      if (w.display_hint) html += `<td class="rep bad">${w.well} ⚠ ${cqTxt}</td>`;
      else html += `<td class="rep ok">${w.well} ✓ ${cqTxt}</td>`;
    }
    html += '</tr>';
  }
  el('resultsTable').innerHTML = html;
}

// ---- 증폭 곡선 (결정 12: 시나리오 파일의 실제 형광값을 그대로 그린다.
//      Agent가 MCP get_qpcr_curves로 받는 값과 같은 출처 — /state의 fluorescence 필드는
//      대시보드 전용 사본일 뿐, 숫자 자체는 서버가 새로 만들지 않는다.) ----
const CQ_THRESHOLD = 0.2; // server/state.py의 CQ_THRESHOLD와 동일값(대시보드 표시 전용 상수, 결정 30 시각화 ②)
const CYCLE_SECONDS = 2; // 결정 11의 고정값(40사이클×2초) — /state에는 안 실려서 클라이언트도 같은 상수를 씀

function buildCurveDatasets(state) {
  const total = state.qpcr_run.total_cycles;
  // 버그 수정(결정 30): labels를 진행 사이클이 아니라 항상 1..total_cycles 전체로 고정한다.
  // 진행분만큼만 만들면 카테고리 축의 칸 수가 매 프레임 바뀌어 x.max(인덱스)와 어긋나 아예 안 그려졌다.
  const labels = Array.from({ length: total }, (_, i) => i + 1);
  const datasets = [];
  for (const [wellId, w] of Object.entries(state.plate.wells)) {
    if (w.status === 'empty' || !w.fluorescence || !w.fluorescence.length) continue; // 플레이트에 없는 well
    const isBad = !!w.display_hint;
    datasets.push({
      label: wellId,
      // 호버 툴팁용 부가 정보 — Chart.js는 모르는 속성을 그대로 보존해준다
      sampleId: w.sample_id,
      repLabel: 'ABC'[w.replicate - 1] || wellId[0],
      data: w.fluorescence, // 서버가 이미 진행 사이클만큼만 잘라서 준다 — 나머지는 그냥 안 그려져서 "차오르는" 효과가 남
      borderColor: isBad ? '#d33' : 'rgba(120,120,120,.4)',
      borderWidth: isBad ? 2.5 : 1,
      pointRadius: 0, pointHitRadius: 8, pointHoverRadius: 3,
      tension: 0.15, order: isBad ? 0 : 1,
    });
  }
  datasets.push({
    label: '임계값',
    data: labels.map(() => CQ_THRESHOLD), // 시각화 ②: 형광 0.2 가로 점선, 축 전체 길이로 고정
    borderColor: '#aaa',
    borderDash: [6, 4],
    borderWidth: 1,
    pointRadius: 0,
    order: 2,
  });
  return { labels, datasets };
}

function renderCurves(state) {
  const run = state.qpcr_run;
  const cycle = run.cycle;
  const total = run.total_cycles;

  el('curvesDetail').textContent = run.running
    ? `사이클 ${cycle} / ${total}`
    : `측정 완료 · ${state.batch}`;

  if (cycle <= 0) {
    el('curveEmpty').style.display = 'block';
    el('curveWrap').style.display = 'none';
  } else {
    el('curveEmpty').style.display = 'none';
    el('curveWrap').style.display = 'block';
    const { labels, datasets } = buildCurveDatasets(state);
    if (!curveChart) {
      const ctx = el('curveCanvas').getContext('2d');
      curveChart = new Chart(ctx, {
        type: 'line',
        data: { labels, datasets },
        options: {
          responsive: true, maintainAspectRatio: false, animation: false,
          interaction: { mode: 'nearest', intersect: true },
          plugins: {
            legend: { display: false },
            tooltip: {
              enabled: true,
              filter: (item) => item.dataset.label !== '임계값', // 점선은 툴팁 대상에서 제외
              callbacks: {
                title: (items) => {
                  const d = items[0].dataset;
                  return `${d.sampleId} · 반복 ${d.repLabel} (well ${d.label})`;
                },
                label: (item) => `사이클 ${item.label} · 형광 ${item.parsed.y}`,
              },
            },
          },
          scales: {
            // 버그 수정: x.min/max로 카테고리 인덱스를 강제하지 않는다 — labels가 이미 1..total_cycles로
            // 고정돼 있으니 축은 그 길이에 맞춰 자연스럽게 잡힌다.
            x: { title: { display: true, text: '사이클' } },
            y: { title: { display: true, text: '빛의 세기(형광)' }, min: 0, max: 1.1 },
          },
        },
      });
    } else {
      curveChart.data.labels = labels;
      curveChart.data.datasets = datasets;
      curveChart.update('none');
    }
  }

  // 시각화 ③: 런 진행 바 + 사이클/예상 남은 시간(결정론 값)
  const pct = total > 0 ? Math.min(100, (cycle / total) * 100) : 0;
  el('curveProgressFill').style.width = `${pct}%`;
  if (run.running) {
    const remainSec = Math.max(0, (total - cycle) * CYCLE_SECONDS);
    el('curveProgressText').textContent = `사이클 ${cycle} / ${total} · 약 ${remainSec}초 남음`;
  } else {
    el('curveProgressText').textContent = '측정 완료';
  }
}

// ---- Trace 타임라인 ----
// 카드에 붙는 기기 칩 — 어느 tool_call이 어느 기기 일인지(결정 15 카드형·크기 균일은 유지, 칩만 추가).
const TOOL_DEVICE_LABEL = {
  read_nanodrop: 'NanoDrop',
  run_liquid_handler: '액체 핸들러',
  reserve_quantstudio: 'QuantStudio',
  start_qpcr: 'QuantStudio',
  get_qpcr_curves: 'QuantStudio',
};

function traceIconAndClass(ev) {
  if (ev.type === 'tool_call') {
    return {
      icon: `🔧 Tool 호출 — ${ev.label}`,
      cls: ev.rejected ? 'rejected' : 'call',
      device: TOOL_DEVICE_LABEL[ev.tool] || null,
    };
  }
  if (ev.type === 'user_prompt') return { icon: '💬 사용자 프롬프트', cls: 'user', device: null };
  if (ev.type === 'human_approval') {
    return ev.status === 'pending'
      ? { icon: '⏳ 사람 승인 — 대기중', cls: 'approval', device: null }
      : { icon: '✅ 사람 승인', cls: 'approval', device: null };
  }
  return { icon: ev.type, cls: '', device: null };
}
function traceBody(ev) {
  if (ev.type === 'tool_call') {
    return `<span class="tool">${ev.tool}</span> <span class="res">→ ${ev.result_summary}</span>`;
  }
  if (ev.type === 'user_prompt') return `"${ev.text}"`;
  if (ev.type === 'human_approval') return `${ev.detail || ''}`;
  return '';
}
function traceLi(ev) {
  const { icon, cls, device } = traceIconAndClass(ev);
  const li = document.createElement('li');
  li.className = cls;
  li.dataset.seq = ev.seq;
  const deviceChip = device ? ` <span class="device-chip">${device}</span>` : '';
  li.innerHTML = `<div class="t"><span>${icon}${deviceChip}</span><span class="ts">${ev.time}</span></div>${traceBody(ev)}`;
  return li;
}
function upsertTrace(ev) {
  const list = el('traceList');
  const existing = list.querySelector(`li[data-seq="${ev.seq}"]`);
  if (existing) {
    existing.replaceWith(traceLi(ev));
    return;
  }
  traceSeqSeen.add(ev.seq);
  const li = traceLi(ev);
  li.classList.add('just-in'); // 방금 도착한 카드만 은은하게 페이드인(상태 갱신 시엔 재생 안 함)
  list.insertBefore(li, list.firstChild);
  el('traceEmpty').style.display = 'none';
}
function renderTraceInit(events) {
  const list = el('traceList');
  list.innerHTML = '';
  traceSeqSeen.clear();
  for (const ev of events) { // 이미 최신순
    traceSeqSeen.add(ev.seq);
    list.appendChild(traceLi(ev));
  }
  el('traceEmpty').style.display = events.length ? 'none' : 'block';
}

// ---- qPCR 런 중 자동 새로고침 (서버 계산은 경과시간 기반, 클라이언트는 폴링만) ----
function ensurePolling(state) {
  const shouldPoll = !!(state.qpcr_run && state.qpcr_run.running);
  if (shouldPoll && !pollTimer) {
    pollTimer = setInterval(() => fetchState(false), 1000);
  } else if (!shouldPoll && pollTimer) {
    clearInterval(pollTimer);
    pollTimer = null;
  }
}

// ---- batch 세그먼트 토글 (결정 28) ----
function updateBatchToggle(batch) {
  document.querySelectorAll('#batchToggle .batch-seg').forEach((btn) => {
    btn.classList.toggle('active', btn.dataset.batch === batch);
  });
}

// ---- 상태 적용 ----
function applyState(state) {
  lastState = state;
  updateBatchToggle(state.batch);
  renderDevices(state);
  renderSections(state);
  ensurePolling(state);
}

async function fetchState(withTrace) {
  const res = await fetch('/state');
  const state = await res.json();
  applyState(state);
  if (withTrace) renderTraceInit(state.trace || []);
}

// ---- SSE ----
function connect() {
  const es = new EventSource('/events');
  es.addEventListener('open', () => { el('connLabel').textContent = ''; el('connLabel').classList.remove('off'); });
  es.addEventListener('error', () => { el('connLabel').textContent = '● 연결 끊김'; el('connLabel').classList.add('off'); });
  es.addEventListener('state', (e) => applyState(JSON.parse(e.data)));
  es.addEventListener('trace', (e) => {
    const ev = JSON.parse(e.data);
    upsertTrace(ev);
    triggerDeviceActivity(ev);
  });
  es.addEventListener('trace_reset', async () => {
    for (const key of Object.keys(deviceActivity)) {
      if (deviceActivityTimers[key]) { clearTimeout(deviceActivityTimers[key]); deviceActivityTimers[key] = null; }
      deviceActivity[key] = null;
    }
    // 상태 보존형 batch 전환(결정 28)에서는 trace_reset이 "비움"이 아니라 "다른 batch의 trace로
    // 교체"일 수 있으니, 무조건 비우지 않고 /state를 다시 받아 통째로 다시 그린다.
    await fetchState(true);
  });
}

// ---- 프롬프트 모음 패널 (결정 26) ----
let promptsLoaded = false;

function escapeHtml(s) {
  return s.replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

async function copyText(text, btn) {
  try {
    await navigator.clipboard.writeText(text);
  } catch (e) {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); } catch (e2) { /* 무시 */ }
    document.body.removeChild(ta);
  }
  const orig = btn.textContent;
  btn.textContent = '복사됨';
  btn.classList.add('copied');
  setTimeout(() => { btn.textContent = orig; btn.classList.remove('copied'); }, 1200);
}

function renderPrompts(stages) {
  const body = el('promptsBody');
  if (!stages || !stages.length) {
    body.innerHTML = '<div class="prompts-empty">등록된 프롬프트가 없습니다.</div>';
    return;
  }
  body.innerHTML = '';
  for (const stage of stages) {
    const section = document.createElement('div');
    section.className = 'prompts-stage';
    const heading = document.createElement('div');
    heading.className = 'prompts-stage-name';
    heading.textContent = stage.stage;
    section.appendChild(heading);
    for (const item of stage.items) {
      const box = document.createElement('div');
      box.className = 'prompt-item';
      box.innerHTML =
        `<div class="prompt-head">` +
          `<div><div class="prompt-name">${escapeHtml(item.name)}</div>` +
          (item.description ? `<div class="prompt-desc">${escapeHtml(item.description)}</div>` : '') +
          `</div>` +
          `<button class="prompt-copy">복사</button>` +
        `</div>` +
        `<div class="prompt-body">${escapeHtml(item.body)}</div>`;
      box.querySelector('.prompt-copy').addEventListener('click', (e) => copyText(item.body, e.currentTarget));
      section.appendChild(box);
    }
    body.appendChild(section);
  }
}

async function loadPrompts() {
  if (promptsLoaded) return;
  const res = await fetch('/prompts');
  const data = await res.json();
  renderPrompts(data.stages || []);
  promptsLoaded = true;
}

function closePrompts() {
  el('promptsPanel').classList.remove('open');
}

el('promptsBtn').addEventListener('click', async () => {
  const panel = el('promptsPanel');
  closeLabnote(); // 프롬프트·실험 노트 패널은 동시에 열지 않는다
  panel.classList.toggle('open');
  if (panel.classList.contains('open')) await loadPrompts();
});
el('promptsCloseBtn').addEventListener('click', closePrompts);

// ---- 실험 노트 패널 (결정 29) — GET /labnote를 열 때마다 새로 받아 초소형 마크다운 변환으로 표시 ----
function renderMiniMarkdown(md) {
  const lines = (md || '').replace(/\r\n/g, '\n').split('\n');
  let html = '';
  let inList = false;
  const closeList = () => { if (inList) { html += '</ul>'; inList = false; } };
  const inline = (s) => escapeHtml(s).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  for (const raw of lines) {
    const line = raw.trim();
    if (!line) { closeList(); continue; }
    if (line.startsWith('## ')) { closeList(); html += `<div class="md-h2">${inline(line.slice(3))}</div>`; continue; }
    if (line.startsWith('# ')) { closeList(); html += `<div class="md-h1">${inline(line.slice(2))}</div>`; continue; }
    if (line.startsWith('- ') || line.startsWith('* ')) {
      if (!inList) { html += '<ul>'; inList = true; }
      html += `<li>${inline(line.slice(2))}</li>`;
      continue;
    }
    closeList();
    html += `<p>${inline(line)}</p>`;
  }
  closeList();
  return html || '<div class="labnote-empty">노트가 비어 있습니다.</div>';
}

async function loadLabnote() {
  const body = el('labnoteBody');
  body.innerHTML = '<div class="labnote-empty">불러오는 중…</div>';
  try {
    const res = await fetch('/labnote');
    if (!res.ok) throw new Error(`status ${res.status}`);
    const data = await res.json();
    body.innerHTML = renderMiniMarkdown(data.markdown);
  } catch (e) {
    body.innerHTML = '<div class="labnote-empty">노트를 불러오지 못했습니다.</div>';
  }
}

function closeLabnote() {
  el('labnotePanel').classList.remove('open');
}

el('labnoteBtn').addEventListener('click', async () => {
  const panel = el('labnotePanel');
  closePrompts(); // 프롬프트·실험 노트 패널은 동시에 열지 않는다
  panel.classList.toggle('open');
  if (panel.classList.contains('open')) await loadLabnote(); // 매번 새로 받아 발표 중 수정도 즉시 반영
});
el('labnoteCloseBtn').addEventListener('click', closeLabnote);

document.addEventListener('keydown', (e) => {
  if (e.key !== 'Escape') return;
  if (el('promptsPanel').classList.contains('open')) closePrompts();
  if (el('labnotePanel').classList.contains('open')) closeLabnote();
});

el('resetBtn').addEventListener('click', async () => {
  if (!confirm('실험 상태를 초기화할까요? (발표 중 오클릭 방지)')) return;
  await fetch('/admin/reset', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}' });
  await fetchState(true); // trace_reset SSE가 늦게 와도 화면이 즉시 맞춰지도록
});
document.querySelectorAll('#batchToggle .batch-seg').forEach((btn) => {
  btn.addEventListener('click', async () => {
    if (btn.classList.contains('active')) return; // 이미 보고 있는 batch — 확인 없이 조용히 무시
    await fetch('/admin/switch-batch', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ batch: btn.dataset.batch }),
    });
    await fetchState(true); // 전환은 파괴가 아니라 이동 — 확인 다이얼로그 없음
  });
});

fetchState(true);
connect();
</script>
